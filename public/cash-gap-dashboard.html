<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>資金預估週報儀表板 - 資金週報系統</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft JhengHei', Arial, sans-serif;
            background: #F8FAFC;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        header {
            background: #FFFFFF;
            color: #1E293B;
            border-bottom: 1px solid #E2E8F0;
            padding: 30px;
            text-align: center;
            position: relative;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .nav-links {
            margin-top: 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }

        .nav-links a {
            color: #1E293B;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 5px;
            background: #F8FAFC;
            transition: all 0.3s;
            font-size: 14px;
        }

        .nav-links a:hover {
            background: #F1F5F9;
            transform: translateY(-2px);
        }
        .user-info { position: absolute; top: 30px; right: 30px; display: flex; align-items: center; gap: 15px; }
        .user-info span { font-size: 0.9em; }
        .user-info button { padding: 6px 12px; border: none; border-radius: 5px; background: #F8FAFC; color: #1E293B; cursor: pointer; transition: background 0.3s; }
        .user-info button:hover { background: #F1F5F9; }

        .content {
            padding: 30px;
        }

        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .summary-card {
            background: #FFFFFF;
            border: 1px solid #E2E8F0;
            color: #1E293B;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
        }

        .summary-card .value {
            color: #F06000;
        }

        .summary-card.warning .value {
            color: #DC2626;
        }

        .summary-card.success .value {
            color: #16A34A;
        }

        .summary-card h3 {
            font-size: 14px;
            margin-bottom: 10px;
            color: #64748B;
        }

        .summary-card .value {
            font-size: 32px;
            font-weight: bold;
        }

        .data-source-note,
        .reconcile-note {
            font-size: 13px;
            color: #666;
            margin: 0 0 15px 0;
            padding: 8px 0;
        }
        .reconcile-note { margin-top: 10px; }

        .filters {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            display: flex;
            gap: 15px;
            align-items: flex-end;
        }

        .filter-group {
            flex: 1;
        }

        .filter-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }

        .filter-group input,
        .filter-group select {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        .account-card {
            background: white;
            border: 2px solid #ddd;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            transition: all 0.3s;
        }

        .account-card.has-gap {
            border-color: #dc3545;
            background: #fff5f5;
        }

        .account-card:hover {
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .account-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 2px solid #eee;
        }

        .account-title h3 {
            color: #333;
            margin-bottom: 5px;
        }

        .account-title .subtitle {
            color: #666;
            font-size: 14px;
        }

        .account-type-badge {
            display: inline-block;
            font-size: 12px;
            font-weight: normal;
            color: #64748B;
            background: #F8FAFC;
            border: 1px solid #E2E8F0;
            border-radius: 4px;
            padding: 2px 8px;
            vertical-align: middle;
        }

        .by-date-details {
            margin-top: 15px;
        }

        .by-date-details summary {
            cursor: pointer;
            font-weight: bold;
            color: #1E293B;
            padding: 10px 0;
        }

        .by-date-details[open] summary {
            margin-bottom: 5px;
        }

        .gap-badge {
            background: #dc3545;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
        }

        .no-gap-badge {
            background: #28a745;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
        }

        .account-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .detail-item {
            padding: 10px;
            background: #f8f9fa;
            border-radius: 5px;
        }

        .detail-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
        }

        .detail-value {
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }

        .detail-value.positive {
            color: #28a745;
        }

        .detail-value.negative {
            color: #dc3545;
        }

        /* 手機版表格可左右滑動 */
        .table-scroll-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin-top: 15px;
        }
        .by-date-table {
            width: 100%;
            min-width: 480px;
            margin-top: 0;
            border-collapse: collapse;
            font-size: 14px;
        }
        .by-date-table th,
        .by-date-table td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        .by-date-table th {
            background: #f0f0f0;
            color: #333;
            font-weight: bold;
        }
        .by-date-table tr:hover {
            background: #f8f9fa;
        }
        .by-date-table .gap-cell {
            font-weight: bold;
        }
        .by-date-table .gap-cell.has-gap {
            color: #dc3545;
        }
        .summary-by-dates {
            margin-top: 20px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        .summary-by-dates table {
            width: 100%;
            min-width: 320px;
            border-collapse: collapse;
        }
        .summary-by-dates th,
        .summary-by-dates td {
            padding: 10px 14px;
            text-align: right;
            border: 1px solid #ddd;
        }
        .summary-by-dates th {
            background: #f8f9fa;
            color: #333;
        }
        .summary-by-dates th:first-child {
            text-align: left;
        }
        .summary-by-dates td:first-child {
            text-align: left;
            font-weight: 500;
        }

        .detail-value.warning {
            color: #ffc107;
            font-size: 20px;
        }

        #nearestGapDate {
            line-height: 1.4;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s;
            background: #1E293B;
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(30, 41, 59, 0.35);
        }

        /* 檢視方式頁籤 */
        .view-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            border-bottom: 1px solid #E2E8F0;
        }

        .view-tab {
            padding: 10px 20px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            color: #64748B;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
        }

        .view-tab.active {
            color: #F06000;
            border-bottom-color: #F06000;
        }

        /* 資金流水帳表格 */
        .ledger-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            white-space: nowrap;
        }

        .ledger-table th,
        .ledger-table td {
            padding: 8px 12px;
            border: 1px solid #E2E8F0;
            text-align: right;
        }

        .ledger-table th.ledger-desc-col,
        .ledger-table td.ledger-desc-col {
            text-align: left;
            white-space: normal;
            width: 220px;
            min-width: 220px;
            max-width: 220px;
        }

        .ledger-table th.ledger-date-col,
        .ledger-table td.ledger-date-col {
            text-align: left;
            width: 90px;
            min-width: 90px;
        }

        /* 凍結左側「月份」「收支項目」兩欄，橫向捲動時仍知道這一列是什麼 */
        .ledger-table th.ledger-date-col,
        .ledger-table td.ledger-date-col {
            position: sticky;
            left: 0;
            z-index: 2;
            background: #FFFFFF;
        }

        .ledger-table th.ledger-desc-col,
        .ledger-table td.ledger-desc-col {
            position: sticky;
            left: 90px;
            z-index: 2;
            background: #FFFFFF;
            box-shadow: 2px 0 4px rgba(0, 0, 0, 0.06);
        }

        .ledger-table thead th {
            background: #F8FAFC;
            color: #1E293B;
        }

        .ledger-table thead th.ledger-date-col,
        .ledger-table thead th.ledger-desc-col {
            z-index: 3;
            background: #F8FAFC;
        }

        .ledger-row-balance td {
            background: #FEF3C7;
            font-weight: bold;
        }

        .ledger-row-balance td.ledger-date-col,
        .ledger-row-balance td.ledger-desc-col {
            background: #FEF3C7;
        }

        .ledger-account-number {
            display: block;
            font-weight: normal;
            font-size: 11px;
            color: #64748B;
        }

        .ledger-amount-expense {
            color: #DC2626;
        }

        .ledger-amount-income {
            color: #16A34A;
        }

        .ledger-negative {
            color: #DC2626;
        }

        .ledger-bank-name {
            display: block;
            font-weight: normal;
            font-size: 11px;
            color: #94A3B8;
        }

        /* 資金流水帳工具列：定存總額 + 帳戶篩選 */
        .ledger-toolbar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .ledger-stat {
            background: #FFFFFF;
            border: 1px solid #E2E8F0;
            border-radius: 10px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .ledger-stat-label {
            font-size: 13px;
            color: #64748B;
        }

        .ledger-stat-value {
            font-size: 20px;
            font-weight: bold;
            color: #F06000;
        }

        .account-filter {
            position: relative;
        }

        .account-filter-panel {
            position: absolute;
            right: 0;
            top: calc(100% + 6px);
            z-index: 10;
            background: #FFFFFF;
            border: 1px solid #E2E8F0;
            border-radius: 10px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            padding: 12px;
            min-width: 260px;
            max-height: 320px;
            overflow-y: auto;
        }

        .account-filter-actions {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #E2E8F0;
        }

        .account-filter-actions button {
            background: none;
            border: none;
            color: #F06000;
            font-size: 13px;
            cursor: pointer;
            padding: 0;
        }

        .account-filter-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 0;
            font-size: 13px;
        }

        .account-filter-item label {
            cursor: pointer;
            flex: 1;
        }

        .account-filter-group-label {
            font-size: 12px;
            font-weight: bold;
            color: #94A3B8;
            margin-top: 8px;
        }

        /* 帳戶卡片檢視：依銀行／帳戶類型分類的餘額小計 */
        .balance-breakdown {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .breakdown-group h4 {
            font-size: 14px;
            color: #64748B;
            margin-bottom: 10px;
        }

        .breakdown-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #E2E8F0;
            font-size: 14px;
        }

        .breakdown-row:last-child {
            border-bottom: none;
        }

        .breakdown-row .value {
            font-weight: bold;
            color: #1E293B;
        }

        @media (max-width: 768px) {
            .account-details {
                grid-template-columns: 1fr;
            }
            .filters {
                flex-direction: column;
            }
            .user-info {
                position: static;
                margin-top: 15px;
                justify-content: center;
            }

            /* 手機版：凍結欄位縮窄，讓帳戶欄位有機會露出來，避免橫向捲動時看不到任何金額 */
            .ledger-table {
                font-size: 11px;
            }

            .ledger-table th,
            .ledger-table td {
                padding: 6px 8px;
            }

            .ledger-table th.ledger-date-col,
            .ledger-table td.ledger-date-col {
                width: 56px;
                min-width: 56px;
                white-space: normal;
                left: 0;
            }

            .ledger-table th.ledger-desc-col,
            .ledger-table td.ledger-desc-col {
                width: 130px;
                min-width: 130px;
                max-width: 130px;
                left: 56px;
            }
        }
    </style>
    <script src="/js/auth-common.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚠️ 資金預估週報儀表板</h1>
            <div class="nav-links">
                <a href="/">🏠 首頁</a>
                <a href="/cash-gap-dashboard.html">⚠️ 資金預估週報</a>
                <a href="/transactions.html">💰 收支記錄</a>
                <a href="/settlement.html">✅ 餘額結算</a>
                <a href="/companies.html">🏢 公司管理</a>
                <a href="/bank-accounts.html">🏦 銀行帳戶</a>
                <a href="/users.html">👥 人員管理</a>
            </div>
            <div class="user-info">
                <span id="currentUser">載入中...</span>
                <button onclick="handleLogout()">登出</button>
            </div>
        </header>

        <div class="content">
            <div id="message"></div>

            <!-- 檢視方式頁籤 -->
            <div class="view-tabs">
                <button type="button" class="view-tab active" id="tabLedgerView" onclick="switchView('ledger')">📋 資金流水帳</button>
                <button type="button" class="view-tab" id="tabCardView" onclick="switchView('card')">📇 帳戶卡片</button>
            </div>

            <!-- 帳戶卡片檢視 -->
            <div id="cardView" style="display: none;">
                <!-- 摘要卡片 -->
                <div class="summary-cards" id="summaryCards">
                    <div class="summary-card">
                        <h3>總餘額</h3>
                        <div class="value" id="totalBalance">$0</div>
                        <div style="font-size: 12px; margin-top: 5px; opacity: 0.9;" id="balanceDate"></div>
                    </div>
                    <div class="summary-card success">
                        <h3>檢視方式</h3>
                        <div class="value" style="font-size: 18px;">未來三個月</div>
                        <div style="font-size: 12px; margin-top: 5px;">每個月 15 號、30 號</div>
                    </div>
                </div>

                <!-- 依銀行／帳戶類型分類的餘額小計 -->
                <div class="balance-breakdown" id="balanceBreakdown"></div>

                <!-- 各日總缺口摘要表 -->
                <div class="summary-by-dates" id="summaryByDatesSection" style="display: none;">
                    <h3 style="margin-bottom: 12px;">各日資金缺口總計</h3>
                    <table id="summaryByDatesTable">
                        <thead><tr><th>日期</th><th>當日總缺口</th></tr></thead>
                        <tbody id="summaryByDatesBody"></tbody>
                    </table>
                </div>

                <!-- 篩選條件 -->
                <div class="filters">
                    <div class="filter-group">
                        <label>顯示選項</label>
                        <select id="filterType" onchange="filterAccounts()">
                            <option value="all">全部帳戶</option>
                            <option value="gap">僅顯示有缺口</option>
                            <option value="safe">僅顯示安全</option>
                        </select>
                    </div>
                    <div>
                        <button class="btn" onclick="recalculateBalances().then(() => loadDashboard())">🔄 重新整理</button>
                    </div>
                </div>

                <!-- 說明 -->
                <p class="data-source-note">以下顯示<strong>未來三個月的每個月 15 號、30 號</strong>的預計餘額與資金缺口（依「收支記錄」中該日前的交易計算）。</p>

                <!-- 帳戶列表 -->
                <div id="accountsList">
                    <div class="loading">載入中...</div>
                </div>
            </div>

            <!-- 資金流水帳檢視 -->
            <div id="ledgerView">
                <p class="data-source-note">帳戶為欄、交易與結餘檢查點為列，黃底列為每月 15 號、30 號的結餘檢查點。</p>

                <div class="ledger-toolbar">
                    <div class="ledger-stat">
                        <span class="ledger-stat-label">定存總額</span>
                        <span class="ledger-stat-value" id="fixedDepositTotal">$0</span>
                    </div>
                    <div class="account-filter">
                        <button type="button" class="btn" id="accountFilterBtn" onclick="toggleAccountFilterPanel()">🏦 顯示帳戶 ▾</button>
                        <div class="account-filter-panel" id="accountFilterPanel" style="display: none;">
                            <div class="account-filter-actions">
                                <button type="button" onclick="selectAllAccounts(true)">全選</button>
                                <button type="button" onclick="selectAllAccounts(false)">取消全選</button>
                            </div>
                            <div id="accountFilterList"></div>
                        </div>
                    </div>
                </div>

                <div class="table-scroll-wrapper" id="ledgerTableContainer">
                    <div class="loading">載入中...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api';
        
        let dashboardData = [];
        let targetDates = [];
        let summaryData = {};

        // 格式化貨幣
        function formatCurrency(amount) {
            if (amount === null || amount === undefined) return '-';
            return new Intl.NumberFormat('zh-TW', {
                style: 'currency',
                currency: 'TWD',
                minimumFractionDigits: 0,
                maximumFractionDigits: 0
            }).format(amount);
        }

        // 格式化日期為 月/日
        function formatDateShort(dateStr) {
            const d = new Date(dateStr + 'T00:00:00');
            return d.toLocaleDateString('zh-TW', { month: 'numeric', day: 'numeric' });
        }

        // 格式化日期為 年/月/日
        function formatDateFull(dateStr) {
            const d = new Date(dateStr + 'T00:00:00');
            return d.toLocaleDateString('zh-TW', { year: 'numeric', month: '2-digit', day: '2-digit' });
        }

        // 進入頁面時自動重新計算所有銀行帳戶即時餘額，再載入儀表板
        function recalculateBalances() {
            return fetch(`${API_BASE}/bank-accounts/recalculate-balances`, { method: 'POST', credentials: 'include' })
                .then(res => res.json())
                .catch(() => ({}));
        }

        // 載入儀表板資料（未來三個月 15 號、30 號）
        function loadDashboard() {
            const loading = document.getElementById('accountsList');
            loading.innerHTML = '<div class="loading">載入中...</div>';

            fetch(`${API_BASE}/cash-gap-dashboard-by-dates`)
                .then(res => res.json())
                .then(data => {
                    if (data.error) {
                        showMessage(data.error, 'error');
                        return;
                    }
                    targetDates = data.targetDates || [];
                    dashboardData = data.data || [];
                    summaryData = data.summary || {};
                    displaySummary(summaryData);
                    displayBalanceBreakdown(dashboardData);
                    displaySummaryByDates(targetDates, summaryData.totalGapByDate || {});
                    displayAccounts(dashboardData);
                })
                .catch(err => {
                    console.error('載入錯誤:', err);
                    showMessage('載入數據失敗: ' + err.message, 'error');
                    loading.innerHTML = '<div class="error">載入失敗，請稍後再試</div>';
                });
        }

        // 顯示摘要
        function displaySummary(summary) {
            document.getElementById('totalBalance').textContent = formatCurrency(summary.totalBalance || 0);
            if (summary.currentDate) {
                document.getElementById('balanceDate').textContent = '截至 ' + formatDateFull(summary.currentDate);
            }
        }

        // 依銀行、依帳戶類型分別加總目前餘額
        function displayBalanceBreakdown(accounts) {
            const container = document.getElementById('balanceBreakdown');
            if (!accounts || accounts.length === 0) {
                container.innerHTML = '';
                return;
            }

            function groupSum(keyFn, fallbackLabel) {
                const totals = new Map();
                accounts.forEach(a => {
                    const key = keyFn(a) || fallbackLabel;
                    totals.set(key, (totals.get(key) || 0) + (a.current_balance || 0));
                });
                return Array.from(totals.entries());
            }

            const byBank = groupSum(a => a.bank_name, '未指定銀行');
            const byType = groupSum(a => a.account_type, '未分類');

            const renderGroup = (title, rows) => `
                <div class="breakdown-group">
                    <h4>${title}</h4>
                    ${rows.map(([label, total]) => `
                        <div class="breakdown-row">
                            <span>${label}</span>
                            <span class="value">${formatCurrency(total)}</span>
                        </div>
                    `).join('')}
                </div>
            `;

            container.innerHTML = renderGroup('依銀行分類', byBank) + renderGroup('依帳戶類型分類', byType);
        }

        // 顯示各日總缺口摘要表
        function displaySummaryByDates(dates, totalGapByDate) {
            const section = document.getElementById('summaryByDatesSection');
            const tbody = document.getElementById('summaryByDatesBody');
            if (!dates || dates.length === 0) {
                section.style.display = 'none';
                return;
            }
            section.style.display = 'block';
            tbody.innerHTML = dates.map(d => {
                const gap = totalGapByDate[d] || 0;
                return `<tr><td>${formatDateFull(d)}</td><td class="${gap > 0 ? 'gap-cell has-gap' : ''}">${formatCurrency(gap)}</td></tr>`;
            }).join('');
        }

        // 顯示帳戶列表（含各日預計餘額與缺口）
        function displayAccounts(accounts) {
            const container = document.getElementById('accountsList');
            const filterType = document.getElementById('filterType').value;

            let filteredAccounts = accounts;
            if (filterType === 'gap') {
                filteredAccounts = accounts.filter(a => (a.by_date || []).some(d => d.gap > 0));
            } else if (filterType === 'safe') {
                filteredAccounts = accounts.filter(a => !(a.by_date || []).some(d => d.gap > 0));
            }

            if (filteredAccounts.length === 0) {
                container.innerHTML = '<div class="loading">尚無帳戶資料或所有帳戶在檢視日期皆安全</div>';
                return;
            }

            container.innerHTML = filteredAccounts.map(account => {
                const byDate = account.by_date || [];
                const hasAnyGap = byDate.some(d => d.gap > 0);
                return `
                <div class="account-card ${hasAnyGap ? 'has-gap' : ''}">
                    <div class="account-header">
                        <div class="account-title">
                            <h3>${account.account_name || '未命名帳戶'}${account.account_type ? ` <span class="account-type-badge">${account.account_type}</span>` : ''}</h3>
                            <div class="subtitle">
                                ${account.company_name || ''}${account.bank_name ? ' - ' + account.bank_name : ''}${account.account_number ? ' - ' + account.account_number : ''}
                            </div>
                        </div>
                        ${hasAnyGap ? 
                            `<div class="gap-badge">⚠️ 部分日期有資金缺口</div>` :
                            `<div class="no-gap-badge">✓ 檢視期內資金充足</div>`
                        }
                    </div>
                    <div class="account-details">
                        <div class="detail-item">
                            <div class="detail-label">期初餘額</div>
                            <div class="detail-value">${formatCurrency(account.opening_balance != null ? account.opening_balance : 0)}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">當前餘額</div>
                            <div class="detail-value">${formatCurrency(account.current_balance)}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">安全水位</div>
                            <div class="detail-value ${account.current_balance < account.safety_level ? 'negative' : ''}">${formatCurrency(account.safety_level)}</div>
                        </div>
                        ${account.last_settlement_date ? `
                        <div class="detail-item">
                            <div class="detail-label">上次結算日期</div>
                            <div class="detail-value" style="font-size: 14px;">${account.last_settlement_date}</div>
                        </div>
                        ` : ''}
                        ${(account.transaction_count != null) ? `
                        <div class="detail-item">
                            <div class="detail-label">參與計算交易筆數</div>
                            <div class="detail-value" style="font-size: 14px;">${account.transaction_count}</div>
                        </div>
                        ` : ''}
                    </div>
                    ${byDate.length ? `
                    <details class="by-date-details" ${hasAnyGap ? 'open' : ''}>
                        <summary>未來三個月各檢查日預計餘額${hasAnyGap ? '（含資金缺口）' : ''}</summary>
                        <div class="table-scroll-wrapper">
                            <table class="by-date-table">
                                <thead><tr><th>日期</th><th>收入合計</th><th>支出合計</th><th>預計餘額</th><th>資金缺口</th></tr></thead>
                                <tbody>
                                    ${byDate.map(d => `
                                        <tr>
                                            <td>${formatDateFull(d.date)}</td>
                                            <td>${formatCurrency(d.income_sum != null ? d.income_sum : 0)}</td>
                                            <td>${formatCurrency(d.expense_sum != null ? d.expense_sum : 0)}</td>
                                            <td class="${d.projected_balance < account.safety_level ? 'detail-value warning' : ''}">${formatCurrency(d.projected_balance)}</td>
                                            <td class="gap-cell ${d.gap > 0 ? 'has-gap' : ''}">${d.gap > 0 ? formatCurrency(d.gap) : '-'}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                        <p class="reconcile-note">預計餘額 = 期初餘額 + 收入合計 − 支出合計。若與 Excel 不符，請確認：① 期初餘額是否在「結算」建立且與 Excel 一致 ② 公司／帳戶／帳號與匯入範本完全一致。</p>
                    </details>
                    ` : ''}
                </div>
            `}).join('');
        }

        // 篩選帳戶
        function filterAccounts() {
            displayAccounts(dashboardData);
        }

        // ==================== 資金流水帳檢視 ====================
        let ledgerLoaded = false;
        let cardViewLoaded = false;
        let ledgerColumns = [];
        let ledgerRows = [];
        let selectedAccountIds = null; // null 代表尚未初始化（預設全選）

        function switchView(view) {
            const isCard = view === 'card';
            document.getElementById('cardView').style.display = isCard ? 'block' : 'none';
            document.getElementById('ledgerView').style.display = isCard ? 'none' : 'block';
            document.getElementById('tabCardView').classList.toggle('active', isCard);
            document.getElementById('tabLedgerView').classList.toggle('active', !isCard);

            if (isCard && !cardViewLoaded) {
                cardViewLoaded = true;
                loadDashboard();
            }
            if (!isCard && !ledgerLoaded) {
                loadLedger();
            }
        }

        function loadLedger() {
            const container = document.getElementById('ledgerTableContainer');
            container.innerHTML = '<div class="loading">載入中...</div>';

            fetch(`${API_BASE}/cash-gap-ledger`)
                .then(res => res.json())
                .then(data => {
                    if (data.error) {
                        container.innerHTML = `<div class="error">${data.error}</div>`;
                        return;
                    }
                    ledgerLoaded = true;
                    ledgerColumns = data.columns || [];
                    ledgerRows = data.rows || [];
                    selectedAccountIds = new Set(ledgerColumns.map(c => c.account_id));
                    buildAccountFilterPanel();
                    renderLedger();
                })
                .catch(err => {
                    console.error('載入資金流水帳失敗:', err);
                    container.innerHTML = '<div class="error">載入失敗，請稍後再試</div>';
                });
        }

        // 依目前勾選的帳戶重新計算定存總額並畫表格
        function renderLedger() {
            const visibleColumns = ledgerColumns.filter(c => selectedAccountIds.has(c.account_id));

            const fixedDepositTotal = visibleColumns
                .filter(c => c.account_type === '定存')
                .reduce((sum, c) => sum + (c.current_balance || 0), 0);
            document.getElementById('fixedDepositTotal').textContent = formatCurrency(fixedDepositTotal);

            displayLedger(visibleColumns, ledgerRows);
        }

        // 建立「顯示帳戶」多選選單內容
        function buildAccountFilterPanel() {
            const listEl = document.getElementById('accountFilterList');
            const companyGroups = [];
            ledgerColumns.forEach((col) => {
                const last = companyGroups[companyGroups.length - 1];
                if (last && last.company_name === (col.company_name || '')) {
                    last.items.push(col);
                } else {
                    companyGroups.push({ company_name: col.company_name || '未分類', items: [col] });
                }
            });

            listEl.innerHTML = companyGroups.map(g => `
                <div class="account-filter-group-label">${g.company_name}</div>
                ${g.items.map(c => `
                    <div class="account-filter-item">
                        <input type="checkbox" id="acctFilter_${c.account_id}" checked onchange="onAccountFilterChange(${c.account_id}, this.checked)">
                        <label for="acctFilter_${c.account_id}">${c.bank_name ? c.bank_name + ' ' : ''}${c.account_name || '未命名帳戶'}</label>
                    </div>
                `).join('')}
            `).join('');
        }

        function toggleAccountFilterPanel() {
            const panel = document.getElementById('accountFilterPanel');
            panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
        }

        function onAccountFilterChange(accountId, checked) {
            if (checked) selectedAccountIds.add(accountId);
            else selectedAccountIds.delete(accountId);
            renderLedger();
        }

        function selectAllAccounts(select) {
            selectedAccountIds = select ? new Set(ledgerColumns.map(c => c.account_id)) : new Set();
            document.querySelectorAll('#accountFilterList input[type="checkbox"]').forEach(cb => { cb.checked = select; });
            renderLedger();
        }

        // 點擊選單外部時關閉篩選面板
        document.addEventListener('click', (event) => {
            const filterEl = document.querySelector('.account-filter');
            if (filterEl && !filterEl.contains(event.target)) {
                document.getElementById('accountFilterPanel').style.display = 'none';
            }
        });

        function displayLedger(columns, rows) {
            const container = document.getElementById('ledgerTableContainer');

            if (columns.length === 0) {
                container.innerHTML = '<div class="loading">尚無啟用中的銀行帳戶，或已取消勾選所有帳戶</div>';
                return;
            }

            // 依公司名稱將相鄰欄位分組，用於表頭合併儲存格
            const companyGroups = [];
            columns.forEach((col) => {
                const last = companyGroups[companyGroups.length - 1];
                if (last && last.company_name === (col.company_name || '')) {
                    last.count++;
                } else {
                    companyGroups.push({ company_name: col.company_name || '未分類', count: 1 });
                }
            });

            const companyHeaderRow = companyGroups.map(g =>
                `<th colspan="${g.count}">${g.company_name}</th>`
            ).join('');

            const accountHeaderRow = columns.map(c => {
                const label = c.account_type ? `${c.account_name}（${c.account_type}）` : (c.account_name || '未命名帳戶');
                const bankLine = c.bank_name ? `<span class="ledger-bank-name">${c.bank_name}</span>` : '';
                const numberLine = c.account_number ? `<span class="ledger-account-number">${c.account_number}</span>` : '';
                return `<th>${bankLine}${label}${numberLine}</th>`;
            }).join('');

            const bodyRows = rows.map((row) => {
                if (row.type === 'balance') {
                    const cells = columns.map(c => {
                        const val = row.balances[c.account_id];
                        const negative = val != null && val < 0;
                        return `<td class="${negative ? 'ledger-negative' : ''}">${formatCurrency(val != null ? val : 0)}</td>`;
                    }).join('');
                    return `
                        <tr class="ledger-row-balance">
                            <td class="ledger-date-col">${formatDateFull(row.date)}</td>
                            <td class="ledger-desc-col">${row.label}</td>
                            ${cells}
                        </tr>
                    `;
                }

                const cells = columns.map(c => {
                    if (c.account_id !== row.account_id) return '<td></td>';
                    const cls = row.txn_type === 'income' ? 'ledger-amount-income' : 'ledger-amount-expense';
                    const text = row.txn_type === 'income'
                        ? formatCurrency(row.amount)
                        : `(${formatCurrency(row.amount).replace(/^-/, '')})`;
                    return `<td class="${cls}">${text}</td>`;
                }).join('');

                return `
                    <tr>
                        <td class="ledger-date-col">${formatDateFull(row.date)}</td>
                        <td class="ledger-desc-col">${row.description || ''}</td>
                        ${cells}
                    </tr>
                `;
            }).join('');

            container.innerHTML = `
                <table class="ledger-table">
                    <thead>
                        <tr>
                            <th class="ledger-date-col">月份</th>
                            <th class="ledger-desc-col">收支項目</th>
                            ${companyHeaderRow}
                        </tr>
                        <tr>
                            <th class="ledger-date-col"></th>
                            <th class="ledger-desc-col"></th>
                            ${accountHeaderRow}
                        </tr>
                    </thead>
                    <tbody>${bodyRows}</tbody>
                </table>
            `;
        }

        // 顯示訊息
        function showMessage(message, type = 'error') {
            const messageDiv = document.getElementById('message');
            messageDiv.className = type;
            messageDiv.textContent = message;
            messageDiv.style.display = 'block';
            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 5000);
        }

        // 頁面載入時執行（先檢查登入 → 自動重新計算餘額 → 載入預設頁籤「資金流水帳」）
        document.addEventListener('DOMContentLoaded', async function() {
            const authenticated = await checkAuth();
            if (!authenticated) return;
            await recalculateBalances();
            loadLedger();
        });
    </script>
</body>
</html>
